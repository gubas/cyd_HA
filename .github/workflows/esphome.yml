# =============================================================================
# ESPHome CI/CD Pipeline
# =============================================================================
# Ce workflow vérifie automatiquement que la configuration ESPHome compile
# sans erreur à chaque push ou pull request.
#
# Avantages:
#   - Détecte les erreurs de syntaxe YAML avant déploiement
#   - Valide les références aux substitutions
#   - Vérifie la compatibilité des composants ESPHome
#   - Badge de statut pour le README
# =============================================================================

name: ESPHome Build

on:
  push:
    branches: [main, master]
    paths:
      - '**.yaml'
      - '**.yml'
      - '**.ttf'
      - '**.h'
  pull_request:
    branches: [main, master]
    paths:
      - '**.yaml'
      - '**.yml'
      - '**.ttf'
      - '**.h'

jobs:
  build:
    name: Compile ESPHome Configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      # 1. Récupère le code source
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # 2. Configure Python & Cache Pip
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # 3. Cache PlatformIO packages
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('cyd_ha.yaml', 'cyd_ha/*.yaml') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      # 4. Installe ESPHome
      - name: Install ESPHome
        run: pip install esphome

      # 5. Télécharge la font Material Design Icons
      - name: Download Material Design Icons font
        run: |
          curl -L -o materialdesignicons-webfont.ttf \
            "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"

      # 6. Crée un fichier secrets.yaml factice pour la compilation
      #    (les vrais secrets ne sont jamais dans le repo)
      - name: Create dummy secrets
        run: |
          cat > secrets.yaml << 'EOF'
          wifi_ssid: "test_ssid"
          wifi_password: "test_password"
          cyd_ha_api_encryption_key: "YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXoxMjM0NTY="
          cyd_ha_ota_password: "test_ota_password"
          cyd_ha_ap_ssid: "Test Fallback AP"
          cyd_ha_ap_password: "test_ap_password"
          EOF

      # 7. Compile la configuration ESPHome (sans flasher)
      - name: Compile ESPHome firmware
        run: esphome compile cyd_ha.yaml

