# =============================================================================
# GitHub Release Automation Pipeline (Semantic Release)
# =============================================================================
# Automates the whole package release workflow including:
#   - Determining the next version number based on Conventional Commits
#   - Generating / updating CHANGELOG.md
#   - Updating version constants across codebase via scripts/update-version.py
#   - Committing release artifacts back to `main`
#   - Creating Git tag and GitHub Release
# =============================================================================

name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Semantic Release & plugins
        run: |
          npm install --no-save \
            semantic-release@^24.2.0 \
            @semantic-release/changelog@^6.0.3 \
            @semantic-release/git@^10.0.1 \
            @semantic-release/exec@^6.0.3 \
            conventional-changelog-conventionalcommits@^8.0.0

      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
