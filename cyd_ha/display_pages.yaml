# =============================================================================
# CYD Display Configuration & Page Orchestration
# =============================================================================
# Display driver setup and high-level page lifecycle orchestration.
# Detailed rendering logic and page layouts are implemented in cyd_ui.h.
# =============================================================================

display:
  - platform: mipi_spi
    id: esp_display
    model: ESP32-2432S028-9342
    spi_id: tft
    cs_pin: GPIO15
    dc_pin: GPIO2
    dimensions:
      width: 320
      height: 240
    rotation: 270
    color_depth: 8bit
    buffer_size: 1.0
    data_rate: 40MHz
    update_interval: 500ms
    lambda: |-
      // 1. Wi-Fi Fallback AP & QR Code Setup
      bool wifi_connected = wifi::global_wifi_component != nullptr && wifi::global_wifi_component->is_connected();
      if (!wifi_connected) {
        cyd_draw_wifi_setup(it, "${wifi_ap_ssid}", "${wifi_ap_password}");
        return;
      }

      // 2. Validate current page based on active components
      cyd_validate_current_page();

      // 3. Auto-cycle timer or Menu display
      static unsigned long last_switch = millis();

      if (id(show_return_page)) {
        last_switch = millis();
        const char* const button_texts[8] = {
          "${btn1_label}", "${btn2_label}", "${btn3_label}", "${btn4_label}",
          "${btn5_label}", "${btn6_label}", "${btn7_label}", "${btn8_label}"
        };
        cyd_draw_menu(it, button_texts, "${project_version}");
        return;
      }

      // Auto-cycle pages if enabled
      unsigned long cycle_interval_ms = id(cyd_cycle_speed).has_state() ? (unsigned long)(id(cyd_cycle_speed).state * 1000) : 8000;
      bool auto_cycle_on = id(cyd_auto_cycle).state;
      if (auto_cycle_on && (millis() - last_switch > cycle_interval_ms)) {
        cyd_next_page();
        last_switch = millis();
      }

      // 4. Background & Global Header
      it.fill(id(black));

      static unsigned long wifi_connect_time = 0;
      if (wifi_connect_time == 0 && wifi_connected) {
        wifi_connect_time = millis();
      }
      bool show_boot_ip = (wifi_connect_time > 0 && millis() - wifi_connect_time < 6000 && id(cyd_ip_address).has_state() && id(cyd_ip_address).state != "");
      cyd_draw_header(it, "${device_friendly_name}", show_boot_ip);

      // 5. Render Active Page
      int page = id(current_page);

      // Sync active page selector with current screen
      const char* const page_names[5] = {"Météo", "Capteurs", "Énergie", "Média", "Imprimante 3D"};
      if (page >= 0 && page < 5 && id(cyd_page_selector).current_option() != page_names[page]) {
        id(cyd_page_selector).publish_state(page_names[page]);
      }

      if (page == 0) {
        const char* city = id(cyd_city_text).state.empty() ? "${location_name}" : id(cyd_city_text).state.c_str();
        cyd_draw_weather_page(it, "${i18n_weather_title}", city, "${i18n_no_alerts}", "${i18n_next_rain_prefix}", "${i18n_next_rain_none}");
      } else if (page == 1) {
        const char* l1 = id(cyd_b1_label).state.empty() ? "${sensor_bloc1_label}" : id(cyd_b1_label).state.c_str();
        const char* l2 = id(cyd_b2_label).state.empty() ? "${sensor_bloc2_label}" : id(cyd_b2_label).state.c_str();
        const char* l3 = id(cyd_b3_label).state.empty() ? "${sensor_bloc3_label}" : id(cyd_b3_label).state.c_str();
        const char* l4 = id(cyd_b4_label).state.empty() ? "${sensor_bloc4_label}" : id(cyd_b4_label).state.c_str();

        image::Image* ic1 = cyd_get_room_icon(id(cyd_b1_icon).current_option(), id(${sensor_bloc1_icon}));
        image::Image* ic2 = cyd_get_room_icon(id(cyd_b2_icon).current_option(), id(${sensor_bloc2_icon}));
        image::Image* ic3 = cyd_get_room_icon(id(cyd_b3_icon).current_option(), id(${sensor_bloc3_icon}));
        image::Image* ic4 = cyd_get_room_icon(id(cyd_b4_icon).current_option(), id(${sensor_bloc4_icon}));

        float off1 = id(cyd_b1_offset).has_state() ? id(cyd_b1_offset).state : 0.0f;
        float off2 = id(cyd_b2_offset).has_state() ? id(cyd_b2_offset).state : 0.0f;
        float off3 = id(cyd_b3_offset).has_state() ? id(cyd_b3_offset).state : 0.0f;
        float off4 = id(cyd_b4_offset).has_state() ? id(cyd_b4_offset).state : 0.0f;

        cyd_draw_sensors_page(it,
          l1, ic1, off1,
          l2, ic2, off2,
          l3, ic3, off3,
          l4, ic4, off4
        );
      } else if (page == 2) {
        cyd_draw_energy_page(it,
          "${energy_bloc1_label}",
          "${energy_bloc2_label}",
          "${energy_bloc3_label}",
          "${energy_bloc4_label}"
        );
      } else if (page == 3) {
        cyd_draw_media_page(it);
      } else if (page == 4) {
        cyd_draw_printer_page(it, "${i18n_printer_title}", "${printer_brand}");
      }

      // 6. Pagination Indicator (• • •)
      cyd_draw_pagination(it, page, cyd_is_media_active(), cyd_is_printer_on());
