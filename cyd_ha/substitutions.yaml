# Device Identity
device_name: cydhapanel
device_friendly_name: CYD HA Panel

# Location / Branding
location_name: Paris
printer_brand: P1S

# Home Assistant Sensor Entities (Temperature & Humidity)
internal_temp_sensor: sensor.living_room_temperature
internal_humidity_sensor: sensor.living_room_humidity
int2_temp_sensor: sensor.office_temperature
int2_humidity_sensor: sensor.office_humidity
outside_temp_sensor: sensor.outdoor_temperature

# Weather Entities
weather_entity: weather.home
freeze_chance: sensor.freeze_chance
snow_chance: sensor.snow_chance
rain_chance: sensor.rain_chance

# Buttons (Service & Entity)
button1_service: cover.open_cover
button1_entity: cover.living_room_shades
button2_service: light.toggle
button2_entity: light.living_room_lights
button3_service: cover.stop_cover
button3_entity: cover.living_room_shades
button4_service: light.toggle
button4_entity: light.floor_lamp
button5_service: cover.close_cover
button5_entity: cover.living_room_shades
button6_service: switch.toggle
button6_entity: switch.3d_printer_power
button7_service: light.toggle
button7_entity: light.kitchen_light

# 3D Printer (BambuLab) Entities
printer_progress: sensor.p1s_3d_printer_progression_de_l_impression
printer_bed_temp: sensor.p1s_3d_printer_temperature_du_lit
printer_bed_temp_target: number.p1s_3d_printer_temperature_cible_du_lit
printer_nozzle_temp: sensor.p1s_3d_printer_temperature_de_la_buse
printer_nozzle_temp_target: number.p1s_3d_printer_temperature_cible_de_la_buse
printer_status: sensor.p1s_3d_printer_etat_de_l_impression
printer_time_remaining: sensor.p1s_3d_printer_temps_restant
printer_end_time: sensor.datefin_print
printer_gcode_file: sensor.p1s_3d_printer_ficher_g_code