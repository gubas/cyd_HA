# =============================================================================
# CYD HA Panel - Configuration
# =============================================================================
# This file centralizes ALL user configuration.
# Labels (text) are defined in language files (i18n/).
#
# Language (uncomment ONE line only):
<<: !include i18n/fr.yaml
#<<: !include i18n/en.yaml
# <<: !include i18n/es.yaml
# =============================================================================

# ─── Device ──────────────────────────────────────────────────────────────────
device_name: cydhapanel
device_friendly_name: CYD HA Panel

# ─── Fallback Wi-Fi AP & Captive Portal ───────────────────────────────────────
wifi_ap_ssid: "CYD-HA-Fallback"
wifi_ap_password: "cyd_ha_password"

# ─── Location ────────────────────────────────────────────────────────────────
location_name: Paris

# ─── Interface ───────────────────────────────────────────────────────────────
menu_timeout_ms: "10000"  # Menu timeout in ms (10s default)

# ─── Weather ─────────────────────────────────────────────────────────────────
weather_entity: weather.home
weather_alert_entity: sensor.weather_alert
rain_forecast_entity: sensor.next_rain
rain_chance_entity: sensor.rain_chance
snow_chance_entity: sensor.snow_chance
freeze_chance_entity: sensor.freeze_chance
outside_temp_entity: sensor.outdoor_temperature

# ─── Indoor Sensors (Sensors Page - 4 blocks max) ────────────────────────────
# Labels defined in i18n/*.yaml (sensor_bloc1_label, sensor_bloc2_label, etc.)
# Use sensor.none to disable a block.

sensor_bloc1_temp_entity: sensor.living_room_temperature
sensor_bloc1_hum_entity: sensor.living_room_humidity
sensor_bloc1_icon: hometemperature

sensor_bloc2_temp_entity: sensor.office_temperature
sensor_bloc2_hum_entity: sensor.office_humidity
sensor_bloc2_icon: deskroom

sensor_bloc3_temp_entity: sensor.bedroom_temperature
sensor_bloc3_hum_entity: sensor.bedroom_humidity
sensor_bloc3_icon: bedroom

sensor_bloc4_temp_entity: sensor.kids_room_temperature
sensor_bloc4_hum_entity: sensor.kids_room_humidity
sensor_bloc4_icon: bedroom

# ─── Energy & Climate (Energy Page - 4 blocks) ──────────────────────────────
# Labels defined in i18n/*.yaml
# Use sensor.none to disable a block or if entity is not yet configured.
energy_power_entity: sensor.none
energy_cost_entity: sensor.none
ac_power_entity: sensor.none
ac_energy_entity: sensor.none

# ─── 3D Printer ──────────────────────────────────────────────────────────────
printer_brand: P1S
printer_switch_entity: switch.3d_printer_power
printer_progress_entity: sensor.p1s_3d_printer_progression_de_l_impression
printer_status_entity: sensor.p1s_3d_printer_etat_de_l_impression
printer_gcode_entity: sensor.p1s_3d_printer_ficher_g_code
printer_time_remaining_entity: sensor.p1s_3d_printer_temps_restant
printer_end_time_entity: sensor.datefin_print
printer_bed_temp_entity: sensor.p1s_3d_printer_temperature_du_lit
printer_bed_target_entity: number.p1s_3d_printer_temperature_cible_du_lit
printer_nozzle_temp_entity: sensor.p1s_3d_printer_temperature_de_la_buse
printer_nozzle_target_entity: number.p1s_3d_printer_temperature_cible_de_la_buse

# ─── Media Player ────────────────────────────────────────────────────────────
media_player_entity: media_player.living_room_speaker

# ─── Menu Buttons (8 buttons) ────────────────────────────────────────────────
# Labels defined in i18n/*.yaml (btn1_label, btn2_label, etc.)
# btn8 = Back (no service/entity)

btn1_service: cover.open_cover
btn1_entity: cover.living_room_shades

btn2_service: light.toggle
btn2_entity: light.living_room_lights

btn3_service: cover.stop_cover
btn3_entity: cover.living_room_shades

btn4_service: light.toggle
btn4_entity: light.floor_lamp

btn5_service: cover.close_cover
btn5_entity: cover.living_room_shades

btn6_service: switch.toggle
btn6_entity: switch.3d_printer_power

btn7_service: light.toggle
btn7_entity: light.kitchen_light