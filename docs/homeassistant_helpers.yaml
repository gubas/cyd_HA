        state_class: measurement
        state: >-
          {% set source = states('input_select.cyd_bloc2_source') %}
          {% if source == 'Salon' %} {{ states('sensor.living_room_humidity') }}
          {% elif source == 'Bureau' %} {{ states('sensor.office_humidity') }}
          {% elif source == 'Chambre Parents' %} {{ states('sensor.bedroom_humidity') }}
          {% elif source == 'Chambre Enfants' %} {{ states('sensor.kids_room_humidity') }}
          {% elif source == 'Cuisine' %} {{ states('sensor.kitchen_humidity') }}
