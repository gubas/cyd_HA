      # ─── BLOC 4 VIRTUAL SENSOR ─────────────────────────────────────────────
      - name: "CYD Bloc 4 Température"
        unique_id: cyd_bloc4_temperature
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: >-
          {% set source = states('input_select.cyd_bloc4_source') %}
          {% if source == 'Salon' %} {{ states('sensor.living_room_temperature') }}
          {% elif source == 'Bureau' %} {{ states('sensor.office_temperature') }}
